version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
      POSTGRES_DB: chatdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
  redis:
    image: redis:7-alpine
    container_name: chat-redis

    ports:
      - "6379:6379"

    restart: unless-stopped